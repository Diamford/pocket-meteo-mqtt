services:
  mosquitto-init:
    image: eclipse-mosquitto:2
    user: "0:0"
    restart: "no"
    entrypoint: ["/bin/sh", "/bootstrap-auth.sh"]
    environment:
      MQTT_USERS: "station01 station02 station03 station04 station05 collector chat01 chat02"
    volumes:
      - ./docker/bootstrap-auth.sh:/bootstrap-auth.sh:ro
      - ${MQTT_SECRETS_DIR:-./secrets}:/run/secrets:ro
      - mosquitto-auth:/generated

  mosquitto:
    image: eclipse-mosquitto:2
    restart: unless-stopped
    logging:
      driver: local
      options:
        max-size: "10m"
        max-file: "5"
    depends_on:
      mosquitto-init:
        condition: service_completed_successfully
    ports:
      - "1883:1883"
      - "9001:9001"
    volumes:
      - ./docker/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - ./docker/acl:/mosquitto/config/acl:ro
      - mosquitto-auth:/run/mosquitto-auth:ro
      - mosquitto-data:/mosquitto/data

  chat-web:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      - mosquitto
    ports:
      - "8080:80"
    volumes:
      - ./web:/usr/share/nginx/html:ro

volumes:
  mosquitto-auth:
  mosquitto-data:
