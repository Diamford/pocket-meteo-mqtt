services:
  mosquitto-init:
    image: eclipse-mosquitto:2
    user: "0:0"
    restart: "no"
    entrypoint: ["/bin/sh", "/bootstrap-auth.sh"]
    environment:
      MQTT_BASE_USERS: "collector chat01 chat02"
    volumes:
      - ./docker/bootstrap-auth.sh:/bootstrap-auth.sh:ro
      - ./docker/nodes:/config/nodes:ro
      - ${MQTT_SECRETS_DIR:-./secrets}:/run/secrets:ro
      - mosquitto-auth:/generated

  mosquitto:
    image: eclipse-mosquitto:2
    restart: unless-stopped
    logging:
      driver: local
      options:
        max-size: "10m"
        max-file: "5"
    depends_on:
      mosquitto-init:
        condition: service_completed_successfully
    ports:
      - "1883:1883"
      - "9001:9001"
    volumes:
      - ./docker/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - mosquitto-auth:/run/mosquitto-auth:ro
      - mosquitto-data:/mosquitto/data

  postgres:
    image: postgres:18.7-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: meteo
      POSTGRES_USER: meteo
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U meteo -d meteo"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres-data:/var/lib/postgresql
    secrets:
      - postgres_password

  collector:
    build:
      context: ./collector
    restart: unless-stopped
    depends_on:
      mosquitto:
        condition: service_started
      postgres:
        condition: service_healthy
    environment:
      MQTT_BROKER: tcp://mosquitto:1883
      MQTT_USERNAME: collector
      MQTT_PASSWORD_FILE: /run/secrets/collector_password
      POSTGRES_HOST: postgres
      POSTGRES_DB: meteo
      POSTGRES_USER: meteo
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets:
      - collector_password
      - postgres_password

  chat-web:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      - mosquitto
    ports:
      - "8080:80"
    volumes:
      - ./web:/usr/share/nginx/html:ro

volumes:
  mosquitto-auth:
  mosquitto-data:
  postgres-data:

secrets:
  collector_password:
    file: ${MQTT_SECRETS_DIR:-./secrets}/collector
  postgres_password:
    file: ${MQTT_SECRETS_DIR:-./secrets}/postgres
