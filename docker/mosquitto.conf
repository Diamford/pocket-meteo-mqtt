listener 1883 0.0.0.0

# Browsers cannot use raw MQTT/TCP, so the test chat connects here.
listener 9001 0.0.0.0
protocol websockets

allow_anonymous false
password_file /run/mosquitto-auth/passwords
acl_file /run/mosquitto-auth/acl

persistence true
persistence_location /mosquitto/data/
autosave_interval 300

log_dest stdout
log_type error
log_type warning
log_type notice
log_type information
log_type subscribe
log_type unsubscribe
log_timestamp true
log_timestamp_format %Y-%m-%dT%H:%M:%S%z
connection_messages true
